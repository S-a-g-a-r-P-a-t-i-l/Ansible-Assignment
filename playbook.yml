---
- name: Deploy Node.js App
  hosts: webservers
  become: yes

  vars:
    repo_url: "https://github.com/eMahtab/node-express-hello-world.git"
    app_directory: "/opt/node-app"
    nodejs_version: "22"
    app_port: 3000
    service_name: "node-app"

  tasks:

    - name: Update apt packages
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Git and curl
      ansible.builtin.apt:
        name:
          - git
          - curl
        state: present

    - name: Add Node.js repository
      ansible.builtin.shell:
        cmd: "curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_version }}.x | bash -"
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: Clone application repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_directory }}"
        version: HEAD

    - name: Install application dependencies
      ansible.builtin.command:
        cmd: npm install
        chdir: "{{ app_directory }}"
        creates: "{{ app_directory }}/node_modules"

    - name: Create Node.js systemd service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ service_name }}.service"
        content: |
          [Unit]
          Description=Node.js Application
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory={{ app_directory }}
          ExecStart=/usr/bin/npm start
          Restart=always
          Environment=PORT={{ app_port }}

          [Install]
          WantedBy=multi-user.target
      notify: Restart Node.js application

    - name: Enable and start Node.js application
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: Restart Node.js application
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: yes
